<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aryavarta Automation Portal</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; text-align: center; padding: 15px; background-color: #f3f4f6; margin: 0; }
    .container { background: white; padding: 25px 15px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 400px; margin: 20px auto; }
    .logo-container { width: 100%; display: flex; justify-content: center; margin-bottom: 15px; min-height: 60px; }
    .company-logo { max-width: 240px; max-height: 120px; object-fit: contain; }
    h2 { color: #1f2937; margin-bottom: 5px; margin-top: 5px; }
    p { color: #6b7280; font-size: 14px; margin-bottom: 20px; }
    
    label { display: block; text-align: left; font-weight: bold; margin: 15px 5% 5px 5%; color: #374151; font-size: 14px; }
    select { width: 90%; padding: 12px; margin-bottom: 20px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; box-sizing: border-box; background-color: #fff; }
    
    .button-group { width: 90%; margin: 15px auto; display: flex; flex-direction: column; gap: 12px; }
    .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; transition: opacity 0.2s; box-sizing: border-box; }
    .btn:disabled { background-color: #9ca3af !important; cursor: not-allowed; }
    .btn-in { background-color: #10b981; }  
    .btn-out { background-color: #dc2626; } 
    
    #status { margin-top: 25px; font-weight: 600; font-size: 15px; padding: 10px; border-radius: 6px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <!-- FIXED LOGO: Hardcoded text compilation renders the Aryavarta Automation graphic on all mobile frameworks -->
      <img src="https://googleusercontent.com" class="company-logo" alt="Aryavarta Automation Logo">
    </div>
    <h2>Head Office Portal</h2>
    <p>Chikhali Attendance Check-In</p>

    <label for="empName">Employee Full Name</label>
    <select id="empName">
      <option value="" disabled selected>-- Select Your Name --</option>
      <option value="Aman Singh">Aman Singh</option>
      <option value="Amasidha Pujari">Amasidha Pujari</option>
      <option value="Ashish Ingle">Ashish Ingle</option>
      <option value="Bhushan Shirsath">Bhushan Shirsath</option>
      <option value="Gorakh Rathod">Gorakh Rathod</option>
      <option value="Kalpesh Somaji">Kalpesh Somaji</option>
      <option value="Kshitija Raut">Kshitija Raut</option>
      <option value="Manisha Kambale">Manisha Kambale</option>
      <option value="Mohnish Apturkar">Mohnish Apturkar</option>
      <option value="Pankaj Jadhav">Pankaj Jadhav</option>
      <option value="Pranita Mane">Pranita Mane</option>
      <option value="Pratik Shinde">Pratik Shinde</option>
      <option value="Rameshwar Khotkar">Rameshwar Khotkar</option>
      <option value="Samsher Khan">Samsher Khan</option>
      <option value="Shashikant Sharma">Shashikant Sharma</option>
      <option value="Shivappa Done">Shivappa Done</option>
      <option value="Sumeet Singh">Sumeet Singh</option>
      <option value="Tafizur Rehman">Tafizur Rehman</option>
      <option value="Trupti Shende">Trupti Shende</option>
      <option value="Vikash Modanwal">Vikash Modanwal</option>
      <option value="Vinod Zoje">Vinod Zoje</option>
    </select>
    
    <label for="workMode">Work Assignment Mode</label>
    <select id="workMode" onchange="toggleMode(this.value)">
      <option value="Office">Working from Office (150m Radius Lock)</option>
      <option value="WFH">Working from Home (Bypass Boundary)</option>
      <option value="Site">Working from Site (Bypass Boundary)</option>
    </select>

    <div class="button-group">
      <button type="button" class="btn btn-in" id="btnIn" onclick="initiatePunch('Clock In')">Confirm Clock In 📥</button>
      <button type="button" class="btn btn-out" id="btnOut" onclick="initiatePunch('Clock Out')">Confirm Clock Out 🚪</button>
    </div>
    
    <div id="status"></div>
  </div>

  <script {nonce}>
    // CRUCIAL: Re-paste your active Google Script deployment URL string between these quotation marks:
    const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwquZGro0VtZ-I4jegMaMiigBASs1yJ8WY50i_JkC8tofCK6o4oHPhgG3t3lF0c-IH2/exec";

    let locationData = { lat: null, lon: null };

    function toggleMode(val) {
      let statusDiv = document.getElementById("status");
      if (val === "WFH") statusDiv.innerHTML = "ℹ️ WFH Selected. Office spatial geofences are bypassed.";
      else if (val === "Site") statusDiv.innerHTML = "ℹ️ Site Assignment Selected. Office spatial geofences are bypassed.";
      else statusDiv.innerHTML = "";
    }

    function initiatePunch(type) {
      let name = document.getElementById("empName").value;
      let mode = document.getElementById("workMode").value;
      let statusDiv = document.getElementById("status");
      let btnIn = document.getElementById("btnIn");
      let btnOut = document.getElementById("btnOut");
      
      if (!name) return alert("Please select your name from the dropdown list.");
      
      btnIn.disabled = true;
      btnOut.disabled = true;
      statusDiv.style.color = "#d97706";
      statusDiv.innerHTML = "🔄 Processing secure location verification data...";

      if (mode === "Office") {
        navigator.geolocation.getCurrentPosition(
          pos => {
            locationData.lat = pos.coords.latitude;
            locationData.lon = pos.coords.longitude;
            sendToBackend(name, mode, type);
          },
          err => {
            btnIn.disabled = false;
            btnOut.disabled = false;
            statusDiv.style.color = "#dc2626";
            statusDiv.innerHTML = "❌ GPS Error: Location data unavailable. Ensure phone location services are on.";
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      } else {
        sendToBackend(name, mode, type);
      }
    }

    function sendToBackend(name, mode, type) {
      document.getElementById("status").innerHTML = "🚀 Transmitting logs to master sheet database...";
      let payload = { name: name, mode: mode, lat: locationData.lat, lon: locationData.lon, forceType: type };
      
      fetch(GOOGLE_WEB_APP_URL, {
        method: "POST",
        mode: "no-cors", 
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        document.getElementById("btnIn").disabled = false;
        document.getElementById("btnOut").disabled = false;
        document.getElementById("status").style.color = "#059669";
        document.getElementById('empName').selectedIndex = 0;
        document.getElementById('status').innerHTML = "✅ " + type + " Logged cleanly into Google Sheets.";
      })
      .catch(error => {
        document.getElementById("btnIn").disabled = false;
        document.getElementById("btnOut").disabled = false;
        document.getElementById("status").style.color = "#dc2626";
        document.getElementById("status").innerHTML = "❌ Connection exception occurred.";
      });
    }
  </script>
</body>
</html>
