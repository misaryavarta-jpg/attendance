<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aryavarta Attendance</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #2563eb;
      --success: #059669;
      --danger: #dc2626;
      --warning: #d97706;
      --bg: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.98);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px 12px;
      color: #1e293b;
    }
    .app-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 410px;
      border-radius: 24px;
      padding: 22px 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      text-align: center;
      position: relative;
    }
    .logo-container { width: 100%; margin-bottom: 12px; }
    .company-logo { width: 100%; max-width: 220px; height: auto; object-fit: contain; }
    h2 { font-size: 20px; font-weight: 800; color: #0f172a; }
    p.sub { font-size: 13px; color: #64748b; margin-bottom: 16px; }

    .user-pill {
      background: #eff6ff;
      border: 1.5px solid #bfdbfe;
      border-radius: 14px;
      padding: 12px 14px;
      text-align: left;
      margin-bottom: 14px;
    }
    .user-pill .title { font-size: 11px; font-weight: 800; color: #1d4ed8; text-transform: uppercase; }
    .user-pill .name { font-size: 17px; font-weight: 800; color: #0f172a; margin-top: 2px; }
    .user-pill .phone { font-size: 12px; color: #64748b; }

    /* Leave Status Badge */
    #leaveStatusBadge {
      display: none;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 14px;
      text-align: left;
      line-height: 1.4;
    }
    .badge-approved { background: #dcfce7; color: #15803d; border: 1.5px solid #86efac; }
    .badge-rejected { background: #fee2e2; color: #991b1b; border: 1.5px solid #fca5a5; }
    .badge-pending { background: #fef3c7; color: #92400e; border: 1.5px solid #fde047; }

    /* Sunday Banner */
    #sundayAlert {
      display: none;
      background: #fee2e2;
      border: 1.5px solid #f87171;
      border-radius: 12px;
      padding: 12px;
      color: #991b1b;
      font-weight: 700;
      font-size: 13.5px;
      margin-bottom: 14px;
    }

    label { display: block; text-align: left; font-size: 13px; font-weight: 700; color: #334155; margin: 10px 0 4px 0; }
    select, input, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.8px solid #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 10px;
      font-family: inherit;
      color: #0f172a;
      background: #fff;
    }
    select:focus, input:focus, textarea:focus { border-color: var(--primary-light); outline: none; }

    .btn-stack { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: transform 0.1s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #94a3b8 !important; cursor: not-allowed; }
    .btn-clockin { background: linear-gradient(135deg, #10b981, #047857); }
    .btn-clockout { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .btn-leave { background: linear-gradient(135deg, #f59e0b, #b45309); }
    .btn-cal { background: #334155; }
    .btn-login { background: var(--primary); }

    #statusMessage {
      font-size: 13px;
      font-weight: 700;
      margin-top: 12px;
      padding: 8px;
      border-radius: 8px;
      line-height: 1.4;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(6px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-card {
      background: #fff;
      width: 90%;
      max-width: 370px;
      border-radius: 20px;
      padding: 20px;
      text-align: left;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal-head h3 { font-size: 17px; font-weight: 800; color: #0f172a; }
    .close-btn { font-size: 24px; cursor: pointer; color: #94a3b8; font-weight: 700; }

    /* Calendar Grid */
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-top: 10px; }
    .cal-hdr { font-size: 11px; font-weight: 800; color: #64748b; padding: 4px 0; }
    .cal-cell {
      padding: 9px 0;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      background: #f1f5f9;
      cursor: pointer;
    }
    .cal-cell.present { background: #dcfce7; color: #166534; }
    .cal-cell.leave { background: #fef3c7; color: #b45309; border: 1.5px solid #f59e0b; }
    .cal-cell.sunday { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="logo-container">
      <img src="logo.png" alt="Aryavarta Automation" class="company-logo">
    </div>

    <h2>Aryavarta Automation</h2>
    <p class="sub">Head Office Attendance Portal</p>

    <!-- First-Time Login Box -->
    <div id="loginView" style="display: none;">
      <label for="regPhone">अपना 10 अंकों का मोबाइल नंबर दर्ज करें:</label>
      <input type="tel" id="regPhone" placeholder="Mobile Number" maxlength="10">
      <button class="btn btn-login" onclick="verifyAndLogin()">पोर्टल शुरू करें 🚀</button>
    </div>

    <!-- Active Form View -->
    <div id="attendanceView" style="display: none;">
      <div class="user-pill">
        <div class="title">प्रमाणित कर्मचारी (Verified)</div>
        <div class="name" id="empDisplayName">लोड हो रहा है...</div>
        <div class="phone" id="empDisplayPhone"></div>
      </div>

      <div id="leaveStatusBadge"></div>
      <div id="sundayAlert">🔴 आज रविवार है (साप्ताहिक अवकाश)। क्लॉक-इन बंद है।</div>

      <div id="dutyControls">
        <label for="workMode">कार्य मोड चुनें (Work Mode):</label>
        <select id="workMode" onchange="handleModeChange(this.value)">
          <option value="Office">Office (150m Geofenced)</option>
          <option value="Site">Work from Site</option>
          <option value="WFH">Work from Home (WFH)</option>
        </select>

        <div id="siteBox" style="display: none;">
          <label for="siteName">साइट / प्रोजेक्ट का नाम (Mandatory):</label>
          <input type="text" id="siteName" placeholder="उदा: Tata Motors Bhosari">
        </div>

        <div id="wfhBox" style="display: none;">
          <label for="wfhReason">WFH का कारण (Reason):</label>
          <input type="text" id="wfhReason" placeholder="उदा: Manager Approved / Documentation">
        </div>

        <div class="btn-stack" id="punchButtons">
          <button class="btn btn-clockin" id="btnClockIn" onclick="handlePunch('Clock In')">📥 Confirm Clock In</button>
          <button class="btn btn-clockout" id="btnClockOut" style="display: none;" onclick="handlePunch('Clock Out')">🚪 Confirm Clock Out</button>
        </div>
      </div>

      <div id="statusMessage"></div>

      <div class="btn-stack" style="margin-top: 18px; border-top: 1.5px solid #f1f5f9; padding-top: 12px;">
        <button class="btn btn-leave" onclick="openLeaveModal()">📝 Apply Leave / Half Day</button>
        <button class="btn btn-cal" onclick="openCalendarModal()">📅 My Calendar</button>
      </div>
    </div>
  </div>

  <!-- Leave Application Modal -->
  <div id="leaveModal" class="modal">
    <div class="modal-card">
      <div class="modal-head">
        <h3>छुट्टी आवेदन (Leave)</h3>
        <span class="close-btn" onclick="closeLeaveModal()">&times;</span>
      </div>
      <label>अवधि चुनें:</label>
      <select id="leaveDuration" onchange="toggleLeaveDates(this.value)">
        <option value="single">Single Day</option>
        <option value="range">Date Range</option>
      </select>

      <label>छुट्टी का प्रकार:</label>
      <select id="leaveType">
        <option value="Full Day Leave">Full Day Leave</option>
        <option value="Half Day Leave">Half Day Leave</option>
      </select>

      <div id="singleDateSec">
        <label>दिनांक (Date):</label>
        <input type="date" id="leaveSingleDate">
      </div>

      <div id="rangeDateSec" style="display:none;">
        <label>प्रारंभ दिनांक:</label>
        <input type="date" id="leaveStartDate">
        <label>अंतिम दिनांक:</label>
        <input type="date" id="leaveEndDate">
      </div>

      <label>कारण (Specific Reason):</label>
      <textarea id="leaveReason" rows="3" placeholder="यहाँ छुट्टी का कारण लिखें..."></textarea>

      <button class="btn btn-leave" id="btnSubmitLeave" onclick="submitLeaveRequest()">आवेदन जमा करें 🚀</button>
    </div>
  </div>

  <!-- Calendar Modal -->
  <div id="calendarModal" class="modal">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="calMonthTitle">उपस्थिति कैलेंडर</h3>
        <span class="close-btn" onclick="closeCalendarModal()">&times;</span>
      </div>
      <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
        <button class="btn btn-cal" style="padding:6px 12px; width:45%;" onclick="changeMonth(-1)">◀ पिछला</button>
        <button class="btn btn-cal" style="padding:6px 12px; width:45%;" onclick="changeMonth(1)">अगला ▶</button>
      </div>
      <div class="cal-grid" id="calendarBody"></div>
      <p style="font-size:11px; color:#64748b; font-weight:700; margin-top:10px;">
        🟢 उपस्थित | 🟡 स्वीकृत अवकाश | 🔴 रविवार
      </p>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // CONFIGURATION
    // -------------------------------------------------------------
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyAX7DXc4kJe197JTE23BbDCwOHJzFcXdb2WwItet4OW1ILEZJHVSDjmTkKaomQaQ51/exec";
    const OFFICE_LAT = 18.6870094;
    const OFFICE_LON = 73.8056477;
    const MAX_METERS = 150.0;

    let currentEmp = { name: "", phone: "" };
    let calDate = new Date();

    // -------------------------------------------------------------
    // ROBOTIC HINDI VOICE
    // -------------------------------------------------------------
    function speakHindi(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'hi-IN';
      utter.rate = 0.95;
      const voices = window.speechSynthesis.getVoices();
      const hindiVoice = voices.find(v => v.lang.includes('hi'));
      if (hindiVoice) utter.voice = hindiVoice;
      window.speechSynthesis.speak(utter);
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {};
    }

    // -------------------------------------------------------------
    // INITIALIZATION & DIRECTORY LOOKUP
    // -------------------------------------------------------------
    window.onload = function() {
      const today = new Date();
      const isSunday = today.getDay() === 0;

      const urlParams = new URLSearchParams(window.location.search);
      const queryPhone = urlParams.get('p') || urlParams.get('phone');
      const savedPhone = queryPhone ? queryPhone.replace(/\D/g, '').slice(-10) : localStorage.getItem("aa_user_phone");

      const todayStr = today.toISOString().split('T')[0];
      document.getElementById("leaveSingleDate").value = todayStr;
      document.getElementById("leaveStartDate").value = todayStr;
      document.getElementById("leaveEndDate").value = todayStr;

      if (savedPhone && savedPhone.length === 10) {
        loadEmployeeSession(savedPhone, isSunday);
      } else {
        document.getElementById("loginView").style.display = "block";
      }
    };

    function verifyAndLogin() {
      const phone = document.getElementById("regPhone").value.replace(/\D/g, '').slice(-10);
      if (phone.length !== 10) return alert("कृपया 10 अंकों का वैध मोबाइल नंबर दर्ज करें।");

      showMessage("प्रमाणीकरण हो रहा है...", "#2563eb");
      fetch(`${SCRIPT_URL}?action=verifyEmployee&phone=${phone}`)
        .then(r => r.json())
        .then(res => {
          if (res.success) {
            localStorage.setItem("aa_user_phone", phone);
            localStorage.setItem("aa_user_name", res.employee.name);
            loadEmployeeSession(phone, new Date().getDay() === 0);
          } else {
            alert(res.message || "कर्मचारी निर्देशिका में यह नंबर दर्ज नहीं है।");
            document.getElementById("statusMessage").innerHTML = "";
          }
        })
        .catch(() => alert("सर्वर से संपर्क नहीं हो सका।"));
    }

    function loadEmployeeSession(phone, isSunday) {
      document.getElementById("loginView").style.display = "none";
      document.getElementById("attendanceView").style.display = "block";

      const cachedName = localStorage.getItem("aa_user_name") || "कर्मचारी";
      currentEmp = { name: cachedName, phone: phone };

      document.getElementById("empDisplayName").innerText = currentEmp.name;
      document.getElementById("empDisplayPhone").innerText = "+91 " + phone;

      if (isSunday) {
        document.getElementById("sundayAlert").style.display = "block";
        document.getElementById("dutyControls").style.display = "none";
        speakHindi(`नमस्ते ${currentEmp.name} जी! आज रविवार का साप्ताहिक अवकाश है।`);
        return;
      }

      // Check current duty status
      fetch(`${SCRIPT_URL}?action=checkStatus&phone=${phone}`)
        .then(r => r.json())
        .then(res => {
          syncStatusUI(res.status, res.latestLeave);
        })
        .catch(() => syncStatusUI("NEEDS_CLOCK_IN", null));
    }

    function syncStatusUI(status, leaveInfo) {
      const btnIn = document.getElementById("btnClockIn");
      const btnOut = document.getElementById("btnClockOut");

      if (status === "WORKING") {
        btnIn.style.display = "none";
        btnOut.style.display = "block";
        showMessage("ℹ️ आप कार्यरत हैं (Active Duty)।", "#2563eb");
        speakHindi(`नमस्ते ${currentEmp.name} जी! आप अभी कार्यरत हैं। काम समाप्त होने पर क्लॉक आउट करें।`);
      } else if (status === "COMPLETED") {
        btnIn.style.display = "none";
        btnOut.style.display = "none";
        showMessage("✅ आज की उपस्थिति पूर्ण हो चुकी है।", "#059669");
        speakHindi(`नमस्ते ${currentEmp.name} जी! आपकी आज की उपस्थिति दर्ज हो चुकी है।`);
      } else {
        btnIn.style.display = "block";
        btnOut.style.display = "none";
        const hr = new Date().getHours();
        const greet = hr < 12 ? "सुप्रभात" : "नमस्ते";
        speakHindi(`${greet} ${currentEmp.name} जी! आर्यावर्त पोर्टल में स्वागत है, कृपया उपस्थिति दर्ज करें।`);
      }

      // Display leave status badge
      const badge = document.getElementById("leaveStatusBadge");
      if (leaveInfo && leaveInfo.status) {
        badge.style.display = "block";
        const st = leaveInfo.status.toLowerCase();
        const dRange = leaveInfo.startDate === leaveInfo.endDate ? leaveInfo.startDate : `${leaveInfo.startDate} to ${leaveInfo.endDate}`;
        if (st === "approved") {
          badge.className = "badge-approved";
          badge.innerHTML = `🟢 ${dRange} की छुट्टी स्वीकृत (Approved) हो चुकी है।`;
        } else if (st === "rejected") {
          badge.className = "badge-rejected";
          badge.innerHTML = `🔴 ${dRange} की छुट्टी अस्वीकृत (Rejected) कर दी गई है।`;
        } else {
          badge.className = "badge-pending";
          badge.innerHTML = `⏳ ${dRange} की छुट्टी अनुमोदन के लिए लंबित (Pending) है।`;
        }
      }
    }

    function handleModeChange(val) {
      document.getElementById("siteBox").style.display = (val === "Site") ? "block" : "none";
      document.getElementById("wfhBox").style.display = (val === "WFH") ? "block" : "none";
    }

    // -------------------------------------------------------------
    // GEOFENCE & PUNCH LOGIC
    // -------------------------------------------------------------
    function calcDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function handlePunch(punchType) {
      const mode = document.getElementById("workMode").value;
      const siteVal = document.getElementById("siteName").value.trim();
      const wfhVal = document.getElementById("wfhReason").value.trim();

      if (mode === "Site" && !siteVal) {
        alert("कृपया साइट का नाम दर्ज करें।");
        return document.getElementById("siteName").focus();
      }
      if (mode === "WFH" && !wfhVal) {
        alert("कृपया WFH का कारण दर्ज करें।");
        return document.getElementById("wfhReason").focus();
      }

      showMessage("🛰️ GPS स्थान सत्यापित किया जा रहा है...", "#d97706");
      speakHindi("स्थान सत्यापित हो रहा है, कृपया प्रतीक्षा करें।");

      const targetDetail = (mode === "Site") ? siteVal : (mode === "WFH" ? wfhVal : "Office Regular");

      // Stage 1: Try High-Accuracy Hardware GPS (12s timeout)
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          verifyAndSendCoordinates(pos, punchType, mode, targetDetail);
        },
        (err) => {
          // If User specifically Denied permission (Error Code 1)
          if (err.code === 1) {
            showMessage("❌ क्रोम में लोकेशन ब्लॉक है! URL बार में बाएँ तरफ 🔒/🎛️ आइकन दबाकर Location को Allow करें।", "#dc2626");
            speakHindi("क्रोम ब्राउज़र में लोकेशन अनुमति बंद है। कृपया अनुमति दें।");
            return;
          }

          // Stage 2: Fallback to Cellular/Wi-Fi positioning (Indoor Office Friendly)
          navigator.geolocation.getCurrentPosition(
            (posFallback) => {
              verifyAndSendCoordinates(posFallback, punchType, mode, targetDetail);
            },
            (errFinal) => {
              if (mode === "Office") {
                showMessage("❌ जीपीएस सिग्नल नहीं मिला। कृपया खुली जगह में जाएं या फोन रीस्टार्ट करें।", "#dc2626");
                speakHindi("जीपीएस सिग्नल नहीं मिला। Office मोड के लिए स्थान अनिवार्य है।");
              } else {
                // Allow Site/WFH without hardware lock if device GPS fails
                sendPunchPayload(punchType, mode, null, null, targetDetail);
              }
            },
            { enableHighAccuracy: false, timeout: 8000, maximumAge: 30000 }
          );
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 10000 }
      );
    }

    function verifyAndSendCoordinates(pos, punchType, mode, detail) {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      if (mode === "Office") {
        const dist = calcDistanceMeters(lat, lon, OFFICE_LAT, OFFICE_LON);
        if (dist > MAX_METERS) {
          showMessage(`❌ ऑफिस से दूरी: ${Math.round(dist)}m (150m सीमा पार)`, "#dc2626");
          speakHindi("आप ऑफिस सीमा से बाहर हैं। उपस्थिति दर्ज नहीं हो सकी।");
          return;
        }
      }

      sendPunchPayload(punchType, mode, lat, lon, detail);
    }

    function sendPunchPayload(punchType, mode, lat, lon, detail) {
      showMessage("सर्वर पर उपस्थिति दर्ज हो रही है...", "#2563eb");
      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          phone: currentEmp.phone,
          punchType: punchType,
          mode: mode,
          lat: lat,
          lon: lon,
          detail: detail
        })
      })
      .then(r => r.json())
      .then(res => {
        if (res.status === "success") {
          showMessage(`✅ ${punchType} सफल!`, "#059669");
          speakHindi(`धन्यवाद ${currentEmp.name} जी, आपका ${punchType === "Clock In" ? "क्लॉक इन" : "क्लॉक आउट"} सफल रहा।`);
          setTimeout(() => location.reload(), 1800);
        } else {
          showMessage(res.message || "त्रुटि उत्पन्न हुई।", "#dc2626");
        }
      })
      .catch(() => showMessage("सर्वर त्रुटि: पुनः प्रयास करें।", "#dc2626"));
    }

    // -------------------------------------------------------------
    // LEAVE MANAGEMENT
    // -------------------------------------------------------------
    function openLeaveModal() { document.getElementById("leaveModal").style.display = "flex"; }
    function closeLeaveModal() { document.getElementById("leaveModal").style.display = "none"; }
    function toggleLeaveDates(val) {
      document.getElementById("singleDateSec").style.display = (val === "single") ? "block" : "none";
      document.getElementById("rangeDateSec").style.display = (val === "range") ? "block" : "none";
    }

    function submitLeaveRequest() {
      const duration = document.getElementById("leaveDuration").value;
      const sDate = duration === "single" ? document.getElementById("leaveSingleDate").value : document.getElementById("leaveStartDate").value;
      const eDate = duration === "single" ? sDate : document.getElementById("leaveEndDate").value;
      const reason = document.getElementById("leaveReason").value.trim();
      const lType = document.getElementById("leaveType").value;

      if (!sDate || !eDate || !reason) return alert("कृपया दिनांक और कारण दोनों दर्ज करें।");

      const btn = document.getElementById("btnSubmitLeave");
      btn.disabled = true;
      btn.innerText = "जमा हो रहा है...";

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          type: "Leave",
          phone: currentEmp.phone,
          leaveType: lType,
          startDate: sDate,
          endDate: eDate,
          reason: reason
        })
      })
      .then(r => r.json())
      .then(res => {
        btn.disabled = false;
        btn.innerText = "आवेदन जमा करें 🚀";
        closeLeaveModal();
        if (res.status === "success") {
          speakHindi("अवकाश आवेदन प्रबंधक को भेज दिया गया है।");
          alert("✅ आवेदन प्रबंधक सुमीत सिंह जी को भेज दिया गया है।");
          location.reload();
        } else {
          alert("आवेदन विफल: " + res.message);
        }
      })
      .catch(() => {
        btn.disabled = false;
        btn.innerText = "आवेदन जमा करें 🚀";
        alert("नेटवर्क त्रुटि: आवेदन जमा नहीं हुआ।");
      });
    }

    // -------------------------------------------------------------
    // CALENDAR VIEW
    // -------------------------------------------------------------
    function openCalendarModal() {
      document.getElementById("calendarModal").style.display = "flex";
      renderCalendar();
    }
    function closeCalendarModal() { document.getElementById("calendarModal").style.display = "none"; }
    function changeMonth(delta) { calDate.setMonth(calDate.getMonth() + delta); renderCalendar(); }

    function renderCalendar() {
      const year = calDate.getFullYear();
      const month = calDate.getMonth();
      const months = ["जनवरी","फरवरी","मार्च","अप्रैल","मई","जून","जुलाई","अगस्त","सितंबर","अक्टूबर","नवंबर","दिसंबर"];
      document.getElementById("calMonthTitle").innerText = `${months[month]} ${year}`;

      const grid = document.getElementById("calendarBody");
      grid.innerHTML = "<div class='cal-hdr'>रवि</div><div class='cal-hdr'>सोम</div><div class='cal-hdr'>मंगल</div><div class='cal-hdr'>बुध</div><div class='cal-hdr'>गुरु</div><div class='cal-hdr'>शुक्र</div><div class='cal-hdr'>शनि</div>";

      fetch(`${SCRIPT_URL}?action=getCalendar&phone=${currentEmp.phone}&month=${month + 1}&year=${year}`)
        .then(r => r.json())
        .then(data => {
          const hist = data.history || {};
          const firstDay = new Date(year, month, 1).getDay();
          const totalDays = new Date(year, month + 1, 0).getDate();

          for (let i = 0; i < firstDay; i++) grid.innerHTML += "<div></div>";

          for (let d = 1; d <= totalDays; d++) {
            const dKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const isSun = new Date(year, month, d).getDay() === 0;
            let cls = "cal-cell";

            if (isSun) cls += " sunday";
            if (hist[dKey]) {
              if (hist[dKey].isLeave) cls += " leave";
              else cls += " present";
            }

            const cell = document.createElement("div");
            cell.className = cls;
            cell.innerText = d;
            cell.onclick = () => {
              if (hist[dKey]) alert(hist[dKey].isLeave ? "स्वीकृत छुट्टी (Approved Leave)" : hist[dKey].punches.join("\n"));
              else if (isSun) alert("रविवार (Sunday Weekly Off)");
              else alert("कोई रिकॉर्ड नहीं (Absent)");
            };
            grid.appendChild(cell);
          }
        });
    }

    function showMessage(msg, color) {
      const el = document.getElementById("statusMessage");
      el.innerText = msg;
      el.style.color = color;
      el.style.background = color + "15";
    }
  </script>
</body>
</html>
