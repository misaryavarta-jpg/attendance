    select { width: 90%; padding: 12px; margin-bottom: 20px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; box-sizing: border-box; background-color: #fff; }
    
    /* DOUBLE ACTION SELECTION BUTTON LAYOUTS */

    .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; transition: opacity 0.2s; box-sizing: border-box; }
    .btn:disabled { background-color: #9ca3af !important; cursor: not-allowed; }
    .btn-in { background-color: #10b981; }  /* Emerald Green */
    .btn-out { background-color: #dc2626; } /* Corporate Red */
    
    #status { margin-top: 25px; font-weight: 600; font-size: 15px; padding: 10px; border-radius: 6px; line-height: 1.4; }

    <label for="workMode">Work Assignment Mode</label>
    <select id="workMode" onchange="toggleMode(this.value)">
      <option value="Office">Working from Office (150m Radius Lock)</option>
      <option value="WFH">Working from Home (Bypass Boundary)</option>
      <option value="Site">Working from Site (Bypass Boundary)</option>
    </select>

    <!-- TWO SEPARATE BUTTONS CLEAR TRACKING HANG-UPS FOR GOOD -->
    <div class="button-group">
      <button type="button" class="btn btn-in" id="btnIn" onclick="initiatePunch('Clock In')">Confirm Clock In 📥</button>
      <button type="button" class="btn btn-out" id="btnOut" onclick="initiatePunch('Clock Out')">Confirm Clock Out 🚪</button>
    </div>
    
    <div id="status"></div>
  </div>

  <script>
    // PASTE YOUR LATEST DEPLOYMENT WEB APP URL COPIED FROM GOOGLE SCRIPT HERE:
    const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwquZGro0VtZ-I4jegMaMiigBASs1yJ8WY50i_JkC8tofCK6o4oHPhgG3t3lF0c-IH2/exec";

    let locationData = { lat: null, lon: null };

    function toggleMode(val) {
      let statusDiv = document.getElementById("status");
      if (val === "WFH") statusDiv.innerHTML = "ℹ️ WFH Selected. Office spatial geofences are bypassed.";
      else if (val === "Site") statusDiv.innerHTML = "ℹ️ Site Assignment Selected. Office spatial geofences are bypassed.";
      else statusDiv.innerHTML = "";
    }

    function initiatePunch(type) {
      let name = document.getElementById("empName").value;
      let mode = document.getElementById("workMode").value;
      let statusDiv = document.getElementById("status");
      let btnIn = document.getElementById("btnIn");
      let btnOut = document.getElementById("btnOut");
      
      if (!name) return alert("Please select your name from the dropdown list.");
      
      btnIn.disabled = true;
      btnOut.disabled = true;
      statusDiv.style.color = "#d97706";
      statusDiv.innerHTML = "🔄 processing secure location verification data...";

      if (mode === "Office") {
        navigator.geolocation.getCurrentPosition(
          pos => {
            locationData.lat = pos.coords.latitude;
            locationData.lon = pos.coords.longitude;
            sendToBackend(name, mode, type);
          },
          err => {
            btnIn.disabled = false;
            btnOut.disabled = false;
            statusDiv.style.color = "#dc2626";
            statusDiv.innerHTML = "❌ GPS Error: Location data unavailable. Ensure phone location services are on.";
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      } else {
        sendToBackend(name, mode, type);
      }
    }

    function sendToBackend(name, mode, type) {
      document.getElementById("status").innerHTML = "🚀 Transmitting logs to master sheet database...";
      let payload = { name: name, mode: mode, lat: locationData.lat, lon: locationData.lon, forceType: type };
      
      fetch(GOOGLE_WEB_APP_URL, {
        method: "POST",
        mode: "no-cors", 
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        document.getElementById("btnIn").disabled = false;
        document.getElementById("btnOut").disabled = false;
        document.getElementById("status").style.color = "#059669";
        document.getElementById("status").innerHTML = "✅ Attendance Activity Received Successfully! Form Reset.";
        document.getElementById('empName').selectedIndex = 0;
        document.getElementById('status').innerHTML = "✅ " + type + " Logged cleanly into Google Sheets.";
      })
      .catch(error => {
        document.getElementById("btnIn").disabled = false;
        document.getElementById("btnOut").disabled = false;
        document.getElementById("status").style.color = "#dc2626";
        document.getElementById("status").innerHTML = "❌ Connection exception occurred.";
      });
    }
  </script>
